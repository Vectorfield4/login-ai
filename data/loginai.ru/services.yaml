# Брифы страниц для фабрики. Это вход генератора, не финальный текст.
# Генератор собирает из каждого блока fixture, RU/EN-словари, калькулятор,
# SEO-метаданные, перелинковку и запись в очередь обложек.
# Финальный текст проходит write-service и service-critic.

defaults:
  proofType: typical-project
  currency: RUB

services:
  - slug: mobile-apps
    group: engineering
    icon: code
    query: "разработка мобильных приложений"
    title: "Разработка мобильных приложений"
    navTitle: "Мобильные приложения"
    tagline: "Проектируем и выпускаем iOS- и Android-приложения с AI-функциями: от прототипа до релиза в сторах."
    description: "Собираем приложение под задачу бизнеса: нативная или кросс-платформенная разработка, AI-ассистент внутри, интеграции с CRM и оплатами, релиз и поддержка. Срок 8–12 недель, фиксированный состав первой версии."
    price: { amount: 1500000, unit: project }
    timeline: "8–12 недель"
    features:
      - title: "Выбор платформы под задачу"
        text: "Считаем стоимость и срок для native, Flutter и React Native. Решение фиксируем до разработки, а не по ходу."
      - title: "AI-функции внутри приложения"
        text: "Чат-ассистент, голосовой ввод, распознавание документов и фото, персональные рекомендации."
      - title: "Интеграции с бизнес-системами"
        text: "CRM, 1С, оплаты, push, аналитика. Данные идут в те системы, где команда уже работает."
      - title: "Релиз и поддержка"
        text: "Готовим приложение к App Store и Google Play, проходим review, выпускаем обновления и следим за крашами."
    scope:
      - "Discovery: цели, сценарии, метрики первой версии"
      - "Архитектура и выбор стека"
      - "UI/UX-дизайн ключевых экранов"
      - "Разработка iOS и Android"
      - "QA, тест-план, проверка на реальных устройствах"
      - "Релиз, аналитика, передача команде"
    deliverables:
      - "Приложение в App Store и Google Play"
      - "Админ-панель и API"
      - "Дизайн-макеты и дизайн-система"
      - "CI/CD и инструкция по релизу"
      - "Документация и обучение команды"
      - "Три месяца гарантийной поддержки"
    process:
      - { step: "Discovery", text: "Собираем сценарии, метрики и ограничения. На выходе — карта экранов и оценка.", weeks: 2 }
      - { step: "Дизайн и архитектура", text: "Прототип, UI-кит, схема данных и интеграций.", weeks: 2 }
      - { step: "Разработка", text: "Итерации по две недели, демо в конце каждой.", weeks: 6 }
      - { step: "QA и релиз", text: "Тесты, store review, аналитика, передача.", weeks: 2 }
    stack: ["React Native", "Flutter", "Swift", "Kotlin", "TypeScript", "PostgreSQL"]
    integrations: ["CRM", "1С", "Ozon", "ЮKassa", "Firebase", "OpenAI API"]
    constraints:
      - "Магазины проверяют приложение: срок review не зависит от нас"
      - "Нужен владелец продукта со стороны заказчика"
      - "Первая версия не включает всё: фиксируем MVP до старта"
      - "Платежи и подписки требуют юридической схемы"
    faq:
      - q: "Сколько стоит приложение?"
        a: "От 1,5 млн ₽ за первую версию. Цена зависит от числа экранов, интеграций и AI-функций."
      - q: "Native или кросс-платформа?"
        a: "Для большинства задач хватает React Native или Flutter. Native выбираем, когда нужны тяжёлые камеры, Bluetooth или максимальная производительность."
      - q: "Сколько ждать релиза?"
        a: "8–12 недель до первой версии в сторах. Review магазинов добавляет 3–7 дней."
      - q: "Что с поддержкой после релиза?"
        a: "Три месяца гарантии входят в проект. Дальше — SLA от 90 тыс. ₽ в месяц."
    related: [ai-agents, ai-for-site, support-sla]
    calculator:
      unit: project
      horizon: 1
      fields:
        - { id: platforms, kind: segmented, options: [one, both], default: both, label: "Платформы" }
        - { id: screens, kind: stepper, min: 5, max: 40, default: 12, label: "Экраны" }
        - { id: ai, kind: toggle, default: false, label: "AI-функции" }
        - { id: integrations, kind: stepper, min: 0, max: 6, default: 2, label: "Интеграции" }
    proof:
      type: typical-project
      note: "Типовой проект; демо и NDA-кейс добавляются после первого внедрения."

  - slug: ecommerce
