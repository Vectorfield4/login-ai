    icon: domain
    query: "разработка интернет-магазина"
    title: "Разработка интернет-магазина"
    navTitle: "Интернет-магазины"
    tagline: "Запускаем магазин с каталогом, оплатой, доставкой и AI-поиском, который понимает запросы покупателей."
    description: "Собираем интернет-магазин на 1C-Bitrix, Shopify, WooCommerce или headless-стеке: каталог, корзина, оплата, доставка, интеграции с 1С, Ozon и Wildberries. AI-поиск и рекомендации поднимают конверсию без переписывания каталога."
    price: { amount: 900000, unit: project }
    timeline: "6–10 недель"
    features:
      - title: "Каталог и карточки товаров"
        text: "Структура каталога, фильтры, варианты, остатки. Карточки готовы к выгрузке на маркетплейсы."
      - title: "Оплата и доставка"
        text: "ЮKassa, Тинькофф, СБП, СДЭК, Boxberry, самовывоз. Схему оплаты и возвратов фиксируем до разработки."
      - title: "AI-поиск и рекомендации"
        text: "Поиск по смыслу, автодополнение, похожие товары, персональные подборки. Работает на существующем каталоге."
      - title: "Интеграции с 1С и маркетплейсами"
        text: "Остатки, цены, заказы, статусы. Один источник данных вместо ручной сверки."
    scope:
      - "Аудит каталога и текущих процессов"
      - "Архитектура магазина и интеграций"
      - "Дизайн каталога, карточки, корзины, checkout"
      - "Разработка и перенос данных"
      - "Подключение оплат, доставки, 1С, маркетплейсов"
      - "Запуск, аналитика, обучение"
    deliverables:
      - "Работающий магазин"
      - "Админ-панель и роли"
      - "Интеграции с 1С, Ozon, Wildberries"
      - "AI-поиск и рекомендации"
      - "Настроенная аналитика"
      - "Инструкция для команды"
    process:
      - { step: "Аудит", text: "Смотрим каталог, заказы, текущую витрину и узкие места.", weeks: 1 }
      - { step: "Архитектура", text: "Выбираем платформу, схему данных и интеграций.", weeks: 1 }
      - { step: "Разработка", text: "Каталог, checkout, оплата, доставка, интеграции.", weeks: 5 }
      - { step: "Запуск", text: "Перенос данных, тесты, аналитика, обучение.", weeks: 2 }
    stack: ["1C-Bitrix", "Shopify", "WooCommerce", "Next.js", "PostgreSQL", "Redis"]
    integrations: ["1С", "Ozon", "Wildberries", "ЮKassa", "СДЭК", "Метрика"]
    constraints:
      - "Перенос каталога требует выгрузки и проверки данных"
      - "Оплата и возвраты зависят от юридической схемы"
      - "Маркетплейсы меняют API и правила модерации"
      - "AI-поиск требует истории запросов или тестового набора"
    faq:
      - q: "Сколько стоит магазин?"
        a: "От 900 тыс. ₽. Цена зависит от каталога, интеграций и выбранной платформы."
      - q: "Можно ли перенести магазин с другой платформы?"
        a: "Да. Переносим каталог, заказы, клиентов и SEO-адреса, чтобы не потерять трафик."
      - q: "Как работает AI-поиск?"
        a: "Индексируем каталог и запросы, добавляем семантический поиск и реранкер. На демо-каталоге из 50 тыс. товаров точность 0,86."
      - q: "Что с поддержкой?"
        a: "После запуска — SLA от 90 тыс. ₽ в месяц: обновления, мониторинг, доработки."
    related: [ai-for-site, image-generation, recommendation-systems, support-sla]
    calculator:
      unit: project
      horizon: 1
      fields:
        - { id: sku, kind: stepper, min: 500, max: 100000, default: 5000, label: "SKU" }
        - { id: platform, kind: segmented, options: [bitrix, shopify, headless], default: bitrix, label: "Платформа" }
        - { id: integrations, kind: stepper, min: 0, max: 6, default: 2, label: "Интеграции" }
        - { id: aiSearch, kind: toggle, default: true, label: "AI-поиск" }
    proof:
      type: typical-project
      note: "Типовой проект; демо на открытом каталоге готовится отдельно."

  - slug: support-sla
    group: engineering
    icon: support-agent
    query: "поддержка сайта"
    title: "Поддержка и сопровождение"
    navTitle: "Поддержка и SLA"
    tagline: "Берём сайт, приложение или AI-систему на сопровождение: SLA, мониторинг, дежурства и понятный список работ."
    description: "Сопровождаем продукты после запуска: следим за доступностью и ошибками, выпускаем обновления, закрываем инциденты по SLA, ведём бэклог доработок. Один договор вместо десяти подрядчиков."
    price: { amount: 90000, unit: month }
    timeline: "от 1 месяца"
    features:
      - title: "SLA с понятными сроками"
        text: "Фиксируем время реакции и восстановления по критичности. Отчёт по каждому инциденту."
      - title: "Мониторинг и дежурства"
        text: "Доступность, ошибки, latency, очереди, стоимость инфраструктуры. Алерты приходят нам, а не вам."
      - title: "Плановые работы"
        text: "Обновления зависимостей, патчи безопасности, бэкапы, проверка восстановления."
      - title: "Бэклог доработок"
        text: "Каждый месяц — часы на развитие. Приоритеты согласуем, а не тушим только пожары."
    scope:
      - "Аудит текущего состояния и рисков"
      - "Согласование SLA и матрицы критичности"
      - "Подключение мониторинга и алертов"
      - "Регламент инцидентов и релизов"
      - "Ежемесячный отчёт и планирование"
    deliverables:
      - "Договор SLA"
      - "Мониторинг и дашборд"
      - "Регламент инцидентов"
      - "Бэкапы и проверка восстановления"
      - "Месячный отчёт"
      - "Часы на доработки"
    process:
      - { step: "Аудит", text: "Смотрим инфраструктуру, код, доступы и текущие риски.", weeks: 1 }
      - { step: "SLA", text: "Фиксируем критичность, сроки реакции и границы работ.", weeks: 1 }
      - { step: "Онбординг", text: "Подключаем мониторинг, доступы, регламенты.", weeks: 1 }
      - { step: "Сопровождение", text: "Дежурства, релизы, отчёты, развитие.", weeks: 4 }
    stack: ["Grafana", "Prometheus", "Sentry", "Kubernetes", "Cloudflare", "PostgreSQL"]
    integrations: ["CRM", "Jira", "Slack", "Telegram", "PagerDuty"]
    constraints:
      - "SLA считается по критичности, а не по всем задачам одинаково"
      - "Нужны доступы и контакт владельца продукта"
      - "Наследие без тестов и документации сначала требует аудита"
      - "Часы на развитие не переносятся бесконечно"
    faq:
      - q: "Сколько стоит поддержка?"
        a: "От 90 тыс. ₽ в месяц. Цена зависит от критичности, объёма и часов на доработки."
      - q: "Что входит в SLA?"
        a: "Время реакции и восстановления по трём уровням критичности, мониторинг, дежурства и отчёт."
      - q: "Вы поддерживаете чужой код?"
        a: "Да, после аудита. Если риски выше выгоды, честно скажем до договора."
      - q: "Можно ли взять только дежурства?"
        a: "Да, есть режим monitoring-only без часов на развитие."
    related: [devops-cloud, qa-automation, ai-application-rescue]
    calculator:
      unit: month
      horizon: 6
      fields:
        - { id: criticality, kind: segmented, options: [standard, high, critical], default: standard, label: "Критичность" }
        - { id: hours, kind: stepper, min: 5, max: 80, default: 20, label: "Часы на доработки" }
        - { id: ai, kind: toggle, default: false, label: "AI-система" }
    proof:
      type: typical-project
      note: "Типовой проект; NDA-кейс появится после первых договоров."

