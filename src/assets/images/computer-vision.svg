<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" aria-hidden="true">
  <!--
    Тематическая иллюстрация «компьютерное зрение» для карточки решения
    computer-vision. Авторская векторная графика, палитра MUI blue (#1976d2):
    промышленная камера направлена на детектируемую деталь (рамка распознавания).
    Текст в иллюстрации отсутствует намеренно (i18n: никакого хардкода).
    Используется как <img>, поэтому цвет фиксирован и одинаково читается
    на светлой и тёмной темах.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3F2FD"/>
      <stop offset="0.55" stop-color="#C7E0F8"/>
      <stop offset="1" stop-color="#B3D6F4"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#8FC0F2"/>
      <stop offset="0.45" stop-color="#42A5F5"/>
      <stop offset="1" stop-color="#1565C0"/>
    </radialGradient>
  </defs>

  <!-- Фон-подложка -->
  <rect width="800" height="500" rx="32" fill="url(#bg)"/>

  <!-- Декор: прицельная сетка (слева сверху) -->
  <circle cx="140" cy="118" r="96" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.5" stroke-dasharray="1 12" stroke-linecap="round"/>
  <line x1="44" y1="118" x2="236" y2="118" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2"/>
  <line x1="140" y1="22" x2="140" y2="214" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="140" cy="118" r="4.5" fill="#FFFFFF" fill-opacity="0.85"/>

  <!-- Декор: мелкие кольца и точки -->
  <circle cx="704" cy="74" r="26" fill="none" stroke="#1976D2" stroke-opacity="0.3" stroke-width="2.5" stroke-dasharray="3 7"/>
  <circle cx="704" cy="74" r="4" fill="#1976D2" fill-opacity="0.3"/>
  <circle cx="716" cy="444" r="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3"/>
  <circle cx="716" cy="444" r="6" fill="#90CAF9" fill-opacity="0.7"/>
  <circle cx="255" cy="60" r="5" fill="#90CAF9" fill-opacity="0.9"/>
  <circle cx="58" cy="212" r="5" fill="#1976D2" fill-opacity="0.35"/>
  <circle cx="80" cy="312" r="6" fill="#FFFFFF" fill-opacity="0.55"/>
  <circle cx="466" cy="448" r="5" fill="#42A5F5" fill-opacity="0.5"/>

  <!-- Пунктирная связь объектив → рамка распознавания -->
  <path d="M 416 340 Q 432 328 449 312" fill="none" stroke="#1976D2" stroke-width="3" stroke-opacity="0.5" stroke-dasharray="1 10" stroke-linecap="round"/>

  <!-- Тень под камерой -->
  <ellipse cx="205" cy="438" rx="118" ry="11" fill="#0D47A1" fill-opacity="0.1"/>

  <!-- Камера (профиль, направлена на деталь) -->
  <rect x="118" y="256" width="88" height="32" rx="9" fill="#1565C0"/>          <!-- видоискатель -->
  <rect x="226" y="272" width="24" height="16" rx="6" fill="#1976D2"/>          <!-- кнопка спуска -->
  <circle cx="266" cy="278" r="12" fill="#1976D2"/>                              <!-- диск режимов -->
  <circle cx="266" cy="278" r="5" fill="#0D47A1"/>
  <rect x="95" y="288" width="205" height="105" rx="20" fill="#0D47A1"/>        <!-- корпус -->
  <rect x="108" y="302" width="12" height="76" rx="6" fill="#FFFFFF" fill-opacity="0.08"/>
  <rect x="127" y="306" width="12" height="68" rx="6" fill="#FFFFFF" fill-opacity="0.08"/>
  <circle cx="284" cy="306" r="4.5" fill="#FFB74D"/>                             <!-- индикатор -->
  <circle cx="284" cy="306" r="8.5" fill="none" stroke="#FFB74D" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="300" y="294" width="84" height="93" rx="14" fill="#1565C0"/>         <!-- оправа объектива -->
  <rect x="384" y="290" width="30" height="100" rx="12" fill="#0D47A1"/>        <!-- переднее кольцо -->
  <rect x="396" y="304" width="10" height="72" rx="5" fill="url(#glass)"/>      <!-- стекло объектива -->
  <rect x="398.5" y="318" width="3" height="44" rx="1.5" fill="#FFFFFF" fill-opacity="0.8"/>
  <rect x="186" y="393" width="30" height="12" fill="#0D47A1"/>                 <!-- стойка -->
  <rect x="128" y="405" width="134" height="18" rx="9" fill="#0D47A1"/>         <!-- основание -->

  <!-- Тень под рамкой/деталью -->
  <ellipse cx="600" cy="402" rx="150" ry="12" fill="#1565C0" fill-opacity="0.08"/>

  <!-- Рамка распознавания (bounding box) -->
  <rect x="450" y="108" width="300" height="284" rx="20" fill="none" stroke="#1565C0" stroke-width="5" stroke-dasharray="12 14"/>
  <rect x="440" y="98" width="20" height="20" rx="6" fill="#FFFFFF" stroke="#1976D2" stroke-width="4"/>
  <rect x="730" y="98" width="20" height="20" rx="6" fill="#FFFFFF" stroke="#1976D2" stroke-width="4"/>
  <rect x="440" y="382" width="20" height="20" rx="6" fill="#FFFFFF" stroke="#1976D2" stroke-width="4"/>
  <rect x="730" y="382" width="20" height="20" rx="6" fill="#FFFFFF" stroke="#1976D2" stroke-width="4"/>

  <!-- Детектируемая деталь: шестерня -->
  <rect x="591" y="126" width="18" height="34" rx="7" fill="#FFFFFF"/>
  <rect x="591" y="126" width="18" height="34" rx="7" fill="#FFFFFF" transform="rotate(45 600 250)"/>
  <rect x="591" y="126" width="18" height="34" rx="7" fill="#FFFFFF" transform="rotate(90 600 250)"/>
  <rect x="591" y="126" width="18" height="34" rx="7" fill="#FFFFFF" transform="rotate(135 600 250)"/>
  <rect x="591" y="126" width="18" height="34" rx="7" fill="#FFFFFF" transform="rotate(180 600 250)"/>
  <rect x="591" y="126" width="18" height="34" rx="7" fill="#FFFFFF" transform="rotate(225 600 250)"/>
  <rect x="591" y="126" width="18" height="34" rx="7" fill="#FFFFFF" transform="rotate(270 600 250)"/>
  <rect x="591" y="126" width="18" height="34" rx="7" fill="#FFFFFF" transform="rotate(315 600 250)"/>
  <circle cx="600" cy="250" r="92" fill="#FFFFFF"/>
  <circle cx="600" cy="250" r="24" fill="#C9E0F7"/>
  <circle cx="600" cy="250" r="32" fill="none" stroke="#DCEBFB" stroke-width="6"/>
  <circle cx="594" cy="234" r="3" fill="#BBDEFB"/>

  <!-- Чип метки детекции (без текста: абстрактные «бары уверенности») -->
  <rect x="468" y="88" width="150" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.95"/>
  <circle cx="494" cy="107" r="6" fill="#1976D2"/>
  <rect x="514" y="96" width="50" height="8" rx="4" fill="#42A5F5"/>
  <rect x="514" y="111" width="32" height="8" rx="4" fill="#90CAF9"/>
</svg>
