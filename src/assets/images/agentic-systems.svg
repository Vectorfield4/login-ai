<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" aria-hidden="true">
  <!--
    Тематическая иллюстрация «агентные системы» для карточки решения
    agentic-systems. Авторская векторная графика, палитра MUI blue (#1976d2):
    ядро-оркестратор в центре, пунктирными связями подключённое к четырём
    специализированным агентам-инструментам (чат-бот, документы, база данных,
    механизм/автоматизация). Пунктирное кольцо вокруг ядра намекает на цикл
    оркестрации. Текст в иллюстрации отсутствует намеренно (i18n: никакого
    хардкода). Используется как <img>, поэтому цвет фиксирован и одинаково
    читается на светлой и тёмной темах.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3F2FD"/>
      <stop offset="0.55" stop-color="#C7E0F8"/>
      <stop offset="1" stop-color="#B3D6F4"/>
    </linearGradient>
  </defs>

  <!-- Фон-подложка -->
  <rect width="800" height="500" rx="32" fill="url(#bg)"/>

  <!-- Декор: кольца и точки по углам -->
  <circle cx="60" cy="54" r="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="1 10" stroke-linecap="round"/>
  <circle cx="744" cy="444" r="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="3 7"/>
  <circle cx="744" cy="444" r="5" fill="#42A5F5" fill-opacity="0.6"/>
  <circle cx="300" cy="66" r="5" fill="#90CAF9" fill-opacity="0.85"/>
  <circle cx="770" cy="76" r="4" fill="#FFFFFF" fill-opacity="0.55"/>
  <circle cx="36" cy="460" r="5" fill="#1976D2" fill-opacity="0.3"/>
  <circle cx="704" cy="242" r="5" fill="#FFFFFF" fill-opacity="0.6"/>

  <!-- Тень под узлами-агентами -->
  <circle cx="185" cy="142" r="50" fill="#0D47A1" fill-opacity="0.06"/>
  <circle cx="615" cy="142" r="50" fill="#0D47A1" fill-opacity="0.06"/>
  <circle cx="185" cy="372" r="50" fill="#0D47A1" fill-opacity="0.06"/>
  <circle cx="615" cy="372" r="50" fill="#0D47A1" fill-opacity="0.06"/>

  <!-- Связи оркестратор → агенты -->
  <line x1="400" y1="250" x2="185" y2="135" stroke="#1976D2" stroke-width="3" stroke-opacity="0.55" stroke-dasharray="1 10" stroke-linecap="round"/>
  <line x1="400" y1="250" x2="615" y2="135" stroke="#1976D2" stroke-width="3" stroke-opacity="0.55" stroke-dasharray="1 10" stroke-linecap="round"/>
  <line x1="400" y1="250" x2="185" y2="365" stroke="#1976D2" stroke-width="3" stroke-opacity="0.55" stroke-dasharray="1 10" stroke-linecap="round"/>
  <line x1="400" y1="250" x2="615" y2="365" stroke="#1976D2" stroke-width="3" stroke-opacity="0.55" stroke-dasharray="1 10" stroke-linecap="round"/>

  <!-- Стрелки направления делегирования (на связях, ближе к агентам) -->
  <polygon points="237.8 163.2 257.1 165.1 250.1 178.3" fill="#1976D2"/>
  <polygon points="562.2 163.2 549.9 178.3 542.9 165.1" fill="#1976D2"/>
  <polygon points="237.8 336.8 250.1 321.7 257.1 334.9" fill="#1976D2"/>
  <polygon points="562.2 336.8 549.9 321.7 542.9 334.9" fill="#1976D2"/>

  <!-- Пунктирное кольцо оркестрации (частично скрыто ядром) -->
  <circle cx="400" cy="250" r="118" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3" stroke-dasharray="2 13" stroke-linecap="round"/>
  <!-- Точки-«сателлиты» на кольце -->
  <circle cx="400" cy="132" r="4" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="282" cy="250" r="4" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="459" cy="147.8" r="4" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- Агент: чат-бот (слева сверху) -->
  <circle cx="185" cy="135" r="50" fill="#FFFFFF" stroke="#1976D2" stroke-width="4.5"/>
  <rect x="163" y="120" width="44" height="28" rx="12" fill="#42A5F5"/>
  <path d="M 176 148 L 184 148 L 180 156 Z" fill="#42A5F5"/>
  <circle cx="174" cy="134" r="2.6" fill="#FFFFFF"/>
  <circle cx="185" cy="134" r="2.6" fill="#FFFFFF"/>
  <circle cx="196" cy="134" r="2.6" fill="#FFFFFF"/>
  <circle cx="215" cy="105" r="5.2" fill="#FFB74D"/>
  <circle cx="215" cy="105" r="9.5" fill="none" stroke="#FFB74D" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Агент: документы (справа сверху) -->
  <circle cx="615" cy="135" r="50" fill="#FFFFFF" stroke="#1976D2" stroke-width="4.5"/>
  <rect x="606" y="106" width="42" height="54" rx="7" fill="#90CAF9"/>
  <rect x="596" y="114" width="42" height="54" rx="7" fill="#42A5F5"/>
  <rect x="604" y="126" width="24" height="5" rx="2.5" fill="#FFFFFF"/>
  <rect x="604" y="136" width="30" height="5" rx="2.5" fill="#FFFFFF"/>
  <rect x="604" y="146" width="18" height="5" rx="2.5" fill="#FFFFFF"/>
  <circle cx="645" cy="105" r="5.2" fill="#FFB74D"/>
  <circle cx="645" cy="105" r="9.5" fill="none" stroke="#FFB74D" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Агент: база данных / CRM-интеграция (слева снизу) -->
  <circle cx="185" cy="365" r="50" fill="#FFFFFF" stroke="#1976D2" stroke-width="4.5"/>
  <ellipse cx="185" cy="350" rx="27" ry="9" fill="#90CAF9"/>
  <path d="M 158 350 v 36 a 27 9 0 0 0 54 0 v -36 Z" fill="#42A5F5"/>
  <rect x="166" y="360" width="6" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="180" y="360" width="6" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.55"/>
  <circle cx="215" cy="335" r="5.2" fill="#FFB74D"/>
  <circle cx="215" cy="335" r="9.5" fill="none" stroke="#FFB74D" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Агент: механизм / автоматизация (справа снизу) -->
  <circle cx="615" cy="365" r="50" fill="#FFFFFF" stroke="#1976D2" stroke-width="4.5"/>
  <rect x="608" y="350" width="14" height="30" rx="6" fill="#1976D2"/>
  <rect x="608" y="350" width="14" height="30" rx="6" fill="#1976D2" transform="rotate(45 615 365)"/>
  <rect x="608" y="350" width="14" height="30" rx="6" fill="#1976D2" transform="rotate(90 615 365)"/>
  <rect x="608" y="350" width="14" height="30" rx="6" fill="#1976D2" transform="rotate(135 615 365)"/>
  <rect x="608" y="350" width="14" height="30" rx="6" fill="#1976D2" transform="rotate(180 615 365)"/>
  <rect x="608" y="350" width="14" height="30" rx="6" fill="#1976D2" transform="rotate(225 615 365)"/>
  <rect x="608" y="350" width="14" height="30" rx="6" fill="#1976D2" transform="rotate(270 615 365)"/>
  <rect x="608" y="350" width="14" height="30" rx="6" fill="#1976D2" transform="rotate(315 615 365)"/>
  <circle cx="615" cy="365" r="8" fill="#1976D2"/>
  <circle cx="615" cy="365" r="3.5" fill="#FFFFFF"/>
  <circle cx="645" cy="335" r="5.2" fill="#FFB74D"/>
  <circle cx="645" cy="335" r="9.5" fill="none" stroke="#FFB74D" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Тень под ядром -->
  <ellipse cx="400" cy="356" rx="100" ry="10" fill="#0D47A1" fill-opacity="0.07"/>

  <!-- Ядро-оркестратор -->
  <rect x="310" y="160" width="180" height="180" rx="46" fill="#1565C0"/>
  <circle cx="400" cy="250" r="70" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="3 10" stroke-linecap="round"/>
  <circle cx="400" cy="250" r="46" fill="#0D47A1"/>
  <circle cx="400" cy="250" r="16" fill="#FFFFFF"/>
  <circle cx="400" cy="250" r="6.5" fill="#42A5F5"/>
</svg>
