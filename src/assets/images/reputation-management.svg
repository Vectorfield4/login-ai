<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" aria-hidden="true">
  <!--
    Тематическая иллюстрация «управление репутацией» для карточки решения
    reputation-management. Авторская векторная графика, палитра MUI blue
    (#1976d2): в центре — щит-бейдж с проверенной галочкой и рядом из пяти
    звёзд (рейтинг), вокруг — пузыри отзывов со звёздами, «проверено»
    и сердечком; хвосты пузырей направлены к щиту. Текст в иллюстрации
    отсутствует намеренно (i18n: никакого хардкода). Используется как <img>,
    поэтому цвет фиксирован и одинаково читается на светлой и тёмной темах.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3F2FD"/>
      <stop offset="0.55" stop-color="#C7E0F8"/>
      <stop offset="1" stop-color="#B3D6F4"/>
    </linearGradient>
    <path id="star" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
  </defs>

  <!-- Фон-подложка -->
  <rect width="800" height="500" rx="32" fill="url(#bg)"/>

  <!-- Декор: кольца и точки по углам и в свободных зонах -->
  <circle cx="64" cy="54" r="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="1 10" stroke-linecap="round"/>
  <circle cx="742" cy="446" r="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="3 7"/>
  <circle cx="742" cy="446" r="5" fill="#42A5F5" fill-opacity="0.6"/>
  <circle cx="330" cy="60" r="5" fill="#90CAF9" fill-opacity="0.85"/>
  <circle cx="40" cy="300" r="5" fill="#1976D2" fill-opacity="0.3"/>
  <circle cx="760" cy="220" r="4.5" fill="#FFFFFF" fill-opacity="0.55"/>
  <circle cx="560" cy="470" r="5" fill="#FFFFFF" fill-opacity="0.55"/>
  <circle cx="700" cy="170" r="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round"/>
  <circle cx="712" cy="270" r="4.5" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="702" cy="352" r="4.5" fill="#FFFFFF" fill-opacity="0.8"/>
  <circle cx="166" cy="452" r="4.5" fill="#FFFFFF" fill-opacity="0.6"/>
  <use href="#star" transform="translate(720 164) scale(0.55) translate(-12 -11.5)" fill="#90CAF9"/>
  <use href="#star" transform="translate(744 236) scale(0.55) translate(-12 -11.5)" fill="#42A5F5"/>

  <!-- Тень под щитом -->
  <ellipse cx="400" cy="430" rx="150" ry="9" fill="#0D47A1" fill-opacity="0.07"/>

  <!-- Пузыри отзывов (хвосты рисуются до прямоугольников, чтобы шов был скрыт) -->
  <!-- Пузырь сверху слева: звёзды -->
  <polygon points="200 136 252 136 240 160" fill="#FFFFFF" stroke="#1976D2" stroke-width="4" stroke-linejoin="round"/>
  <rect x="92" y="70" width="180" height="70" rx="35" fill="#FFFFFF" stroke="#1976D2" stroke-width="4"/>
  <use href="#star" transform="translate(158 104) scale(0.85) translate(-12 -11.5)" fill="#42A5F5"/>
  <use href="#star" transform="translate(182 104) scale(0.85) translate(-12 -11.5)" fill="#42A5F5"/>
  <use href="#star" transform="translate(206 104) scale(0.85) translate(-12 -11.5)" fill="#42A5F5"/>
  <circle cx="252" cy="88" r="5" fill="#FFB74D"/>
  <circle cx="252" cy="88" r="8.5" fill="none" stroke="#FFB74D" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Пузырь сверху справа: проверено -->
  <polygon points="500 108 532 108 486 134" fill="#FFFFFF" stroke="#1976D2" stroke-width="4" stroke-linejoin="round"/>
  <rect x="470" y="54" width="160" height="58" rx="29" fill="#FFFFFF" stroke="#1976D2" stroke-width="4"/>
  <circle cx="550" cy="83" r="11" fill="#1976D2"/>
  <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="#FFFFFF" transform="translate(543.9 76.85) scale(0.5)"/>

  <!-- Пузырь снизу слева: звёзды -->
  <polygon points="228 320 228 352 296 335" fill="#FFFFFF" stroke="#1976D2" stroke-width="4" stroke-linejoin="round"/>
  <rect x="60" y="300" width="180" height="70" rx="35" fill="#FFFFFF" stroke="#1976D2" stroke-width="4"/>
  <use href="#star" transform="translate(130 335) scale(0.65) translate(-12 -11.5)" fill="#90CAF9"/>
  <use href="#star" transform="translate(150 335) scale(0.65) translate(-12 -11.5)" fill="#90CAF9"/>
  <use href="#star" transform="translate(170 335) scale(0.65) translate(-12 -11.5)" fill="#90CAF9"/>

  <!-- Пузырь справа: сердце -->
  <polygon points="530 366 595 366 455 332" fill="#FFFFFF" stroke="#1976D2" stroke-width="4" stroke-linejoin="round"/>
  <rect x="470" y="296" width="180" height="70" rx="35" fill="#FFFFFF" stroke="#1976D2" stroke-width="4"/>
  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#1976D2" transform="translate(545.6 316.4) scale(1.2)"/>

  <!-- Щит-бейдж -->
  <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" fill="#FFFFFF" stroke="#1565C0" stroke-width="0.3" stroke-linejoin="round" transform="translate(220 70) scale(15)"/>
  <!-- Галочка «проверено» -->
  <circle cx="400" cy="140" r="20" fill="#1976D2"/>
  <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="#FFFFFF" transform="translate(386 125.9) scale(1.15)"/>
  <!-- Рейтинг: ряд из пяти звёзд -->
  <use href="#star" transform="translate(310 250) scale(1.75) translate(-12 -11.5)" fill="#1976D2"/>
  <use href="#star" transform="translate(355 250) scale(1.75) translate(-12 -11.5)" fill="#1976D2"/>
  <use href="#star" transform="translate(400 250) scale(1.75) translate(-12 -11.5)" fill="#1976D2"/>
  <use href="#star" transform="translate(445 250) scale(1.75) translate(-12 -11.5)" fill="#1976D2"/>
  <use href="#star" transform="translate(490 250) scale(1.75) translate(-12 -11.5)" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.1"/>
  <!-- Сердце — лояльность аудитории -->
  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#1976D2" transform="translate(385.6 315.4) scale(1.2)"/>
</svg>
