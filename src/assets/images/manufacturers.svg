<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" aria-hidden="true">
  <!--
    Тематическая иллюстрация «производители» для карточки решения
    manufacturers. Авторская векторная графика, палитра MUI blue (#1976d2):
    слева — здание завода с пилообразной крышей, трубой и дымком, из цеха
    выходит конвейер с деталями-кубами; справа — роботизированная рука
    с захватом поднимает деталь над лентой; вверху справа — две шестерни
    автоматизации. Текст в иллюстрации отсутствует намеренно
    (i18n: никакого хардкода). Используется как <img>, поэтому цвет
    фиксирован и одинаково читается на светлой и тёмной темах.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3F2FD"/>
      <stop offset="0.55" stop-color="#C7E0F8"/>
      <stop offset="1" stop-color="#B3D6F4"/>
    </linearGradient>
  </defs>

  <!-- Фон-подложка -->
  <rect width="800" height="500" rx="32" fill="url(#bg)"/>

  <!-- Декор: кольца и точки по углам и в свободных зонах -->
  <circle cx="58" cy="54" r="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="1 10" stroke-linecap="round"/>
  <circle cx="742" cy="446" r="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="3 7"/>
  <circle cx="742" cy="446" r="5" fill="#42A5F5" fill-opacity="0.6"/>
  <circle cx="300" cy="64" r="5" fill="#90CAF9" fill-opacity="0.85"/>
  <circle cx="36" cy="470" r="5" fill="#1976D2" fill-opacity="0.3"/>
  <circle cx="714" cy="200" r="4.5" fill="#FFFFFF" fill-opacity="0.5"/>
  <circle cx="400" cy="440" r="5" fill="#1976D2" fill-opacity="0.3"/>
  <circle cx="160" cy="440" r="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round"/>
  <circle cx="330" cy="150" r="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round"/>
  <circle cx="392" cy="166" r="4.5" fill="#FFFFFF" fill-opacity="0.8"/>

  <!-- Тени под группами -->
  <ellipse cx="150" cy="386" rx="112" ry="9" fill="#0D47A1" fill-opacity="0.07"/>
  <ellipse cx="430" cy="348" rx="170" ry="8" fill="#1565C0" fill-opacity="0.06"/>
  <ellipse cx="652" cy="408" rx="82" ry="8" fill="#0D47A1" fill-opacity="0.07"/>

  <!-- Труба и дым -->
  <rect x="212" y="78" width="26" height="90" rx="9" fill="#42A5F5"/>
  <circle cx="226" cy="58" r="7" fill="#FFFFFF" fill-opacity="0.65"/>
  <circle cx="238" cy="42" r="10" fill="#FFFFFF" fill-opacity="0.45"/>
  <circle cx="250" cy="26" r="6.5" fill="#FFFFFF" fill-opacity="0.35"/>

  <!-- Здание завода -->
  <rect x="60" y="146" width="190" height="24" rx="6" fill="#1565C0"/>
  <polygon points="62 146 80 118 98 146" fill="#42A5F5"/>
  <polygon points="98 146 116 118 134 146" fill="#42A5F5"/>
  <polygon points="134 146 152 118 170 146" fill="#42A5F5"/>
  <polygon points="170 146 188 118 206 146" fill="#42A5F5"/>
  <polygon points="206 146 224 118 242 146" fill="#42A5F5"/>
  <rect x="60" y="170" width="190" height="200" rx="16" fill="#FFFFFF" stroke="#1565C0" stroke-width="4"/>
  <rect x="84" y="200" width="34" height="44" rx="9" fill="#C7E0F8"/>
  <rect x="132" y="200" width="34" height="44" rx="9" fill="#C7E0F8"/>
  <rect x="84" y="258" width="34" height="44" rx="9" fill="#C7E0F8"/>
  <rect x="132" y="258" width="34" height="44" rx="9" fill="#C7E0F8"/>
  <rect x="160" y="286" width="44" height="70" rx="14" fill="#BBDEFB"/>

  <!-- Конвейер -->
  <rect x="250" y="296" width="360" height="28" rx="14" fill="#90CAF9" stroke="#1976D2" stroke-width="2.5"/>
  <circle cx="290" cy="334" r="5.5" fill="#1976D2" fill-opacity="0.4"/>
  <circle cx="352" cy="334" r="5.5" fill="#1976D2" fill-opacity="0.4"/>
  <circle cx="414" cy="334" r="5.5" fill="#1976D2" fill-opacity="0.4"/>
  <circle cx="476" cy="334" r="5.5" fill="#1976D2" fill-opacity="0.4"/>
  <circle cx="538" cy="334" r="5.5" fill="#1976D2" fill-opacity="0.4"/>
  <!-- Детали на ленте -->
  <rect x="330" y="274" width="24" height="22" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="3"/>
  <rect x="428" y="274" width="24" height="22" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="3"/>
  <rect x="536" y="278" width="20" height="18" rx="5" fill="#BBDEFB" stroke="#1565C0" stroke-width="2.5"/>

  <!-- Роботизированная рука -->
  <rect x="598" y="378" width="108" height="18" rx="9" fill="#0D47A1"/>
  <rect x="620" y="290" width="44" height="88" rx="14" fill="#1565C0"/>
  <line x1="642" y1="292" x2="556" y2="246" stroke="#1565C0" stroke-width="15" stroke-linecap="round"/>
  <line x1="556" y1="246" x2="480" y2="258" stroke="#1976D2" stroke-width="15" stroke-linecap="round"/>
  <circle cx="642" cy="292" r="12" fill="#FFFFFF" stroke="#1565C0" stroke-width="3.5"/>
  <circle cx="556" cy="246" r="11" fill="#FFFFFF" stroke="#1565C0" stroke-width="3.5"/>
  <circle cx="480" cy="258" r="9.5" fill="#FFFFFF" stroke="#1976D2" stroke-width="3.5"/>
  <!-- Индикатор на корпусе робота -->
  <circle cx="672" cy="308" r="5" fill="#FFB74D"/>
  <circle cx="672" cy="308" r="8.5" fill="none" stroke="#FFB74D" stroke-opacity="0.35" stroke-width="2"/>
  <!-- Захват с деталью -->
  <rect x="466" y="254" width="7" height="18" rx="3.5" fill="#0D47A1"/>
  <rect x="488" y="254" width="7" height="18" rx="3.5" fill="#0D47A1"/>
  <rect x="462" y="272" width="32" height="22" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="3.5"/>

  <!-- Шестерни автоматизации -->
  <g transform="translate(700 88)">
    <rect x="-7" y="-24" width="14" height="48" rx="7" fill="#1976D2" transform="rotate(0)"/>
    <rect x="-7" y="-24" width="14" height="48" rx="7" fill="#1976D2" transform="rotate(45)"/>
    <rect x="-7" y="-24" width="14" height="48" rx="7" fill="#1976D2" transform="rotate(90)"/>
    <rect x="-7" y="-24" width="14" height="48" rx="7" fill="#1976D2" transform="rotate(135)"/>
    <rect x="-7" y="-24" width="14" height="48" rx="7" fill="#1976D2" transform="rotate(180)"/>
    <rect x="-7" y="-24" width="14" height="48" rx="7" fill="#1976D2" transform="rotate(225)"/>
    <rect x="-7" y="-24" width="14" height="48" rx="7" fill="#1976D2" transform="rotate(270)"/>
    <rect x="-7" y="-24" width="14" height="48" rx="7" fill="#1976D2" transform="rotate(315)"/>
    <circle cx="0" cy="0" r="17" fill="#1976D2"/>
    <circle cx="0" cy="0" r="6.5" fill="#FFFFFF"/>
  </g>
  <g transform="translate(668 144)">
    <rect x="-5" y="-15" width="10" height="30" rx="5" fill="#90CAF9" transform="rotate(22.5)"/>
    <rect x="-5" y="-15" width="10" height="30" rx="5" fill="#90CAF9" transform="rotate(67.5)"/>
    <rect x="-5" y="-15" width="10" height="30" rx="5" fill="#90CAF9" transform="rotate(112.5)"/>
    <rect x="-5" y="-15" width="10" height="30" rx="5" fill="#90CAF9" transform="rotate(157.5)"/>
    <rect x="-5" y="-15" width="10" height="30" rx="5" fill="#90CAF9" transform="rotate(202.5)"/>
    <rect x="-5" y="-15" width="10" height="30" rx="5" fill="#90CAF9" transform="rotate(247.5)"/>
    <rect x="-5" y="-15" width="10" height="30" rx="5" fill="#90CAF9" transform="rotate(292.5)"/>
    <rect x="-5" y="-15" width="10" height="30" rx="5" fill="#90CAF9" transform="rotate(337.5)"/>
    <circle cx="0" cy="0" r="11" fill="#90CAF9"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
</svg>
