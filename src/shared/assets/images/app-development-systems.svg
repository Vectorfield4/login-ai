<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" aria-hidden="true">
  <!--
    Тематическая иллюстрация «системы разработки приложений» для карточки
    решения app-development-systems. Авторская векторная графика, палитра
    MUI blue (#1976d2): слева — колонка исходных файлов-модулей (карточки
    кода с «строками»), пунктирные связи ведут в ядро сборки по центру
    (квадрат с кольцом оркестрации и знаком запуска), оттуда пунктирная
    стрелка — в стек развёртывания справа (три уровня-платформы, верхний
    с галочкой «выпущено»). Текст в иллюстрации отсутствует намеренно
    (i18n: никакого хардкода). Используется как <img>, поэтому цвет
    фиксирован и одинаково читается на светлой и тёмной темах.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3F2FD"/>
      <stop offset="0.55" stop-color="#C7E0F8"/>
      <stop offset="1" stop-color="#B3D6F4"/>
    </linearGradient>
  </defs>

  <!-- Фон-подложка -->
  <rect width="800" height="500" rx="32" fill="url(#bg)"/>

  <!-- Декор: кольца и точки по углам и в свободных зонах -->
  <circle cx="64" cy="54" r="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="1 10" stroke-linecap="round"/>
  <circle cx="742" cy="446" r="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="3 7"/>
  <circle cx="742" cy="446" r="5" fill="#42A5F5" fill-opacity="0.6"/>
  <circle cx="286" cy="60" r="5" fill="#90CAF9" fill-opacity="0.85"/>
  <circle cx="36" cy="470" r="5" fill="#1976D2" fill-opacity="0.3"/>
  <circle cx="700" cy="132" r="4.5" fill="#FFFFFF" fill-opacity="0.5"/>
  <circle cx="452" cy="298" r="4.5" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="500" cy="190" r="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round"/>
  <circle cx="352" cy="86" r="4.5" fill="#FFFFFF" fill-opacity="0.6"/>

  <!-- Тени под группами -->
  <ellipse cx="138" cy="390" rx="70" ry="7" fill="#0D47A1" fill-opacity="0.07"/>
  <ellipse cx="330" cy="352" rx="104" ry="9" fill="#0D47A1" fill-opacity="0.07"/>
  <ellipse cx="610" cy="394" rx="104" ry="8" fill="#0D47A1" fill-opacity="0.07"/>

  <!-- Исходные файлы-модули (колонка слева) -->
  <rect x="96" y="116" width="84" height="58" rx="12" fill="#FFFFFF" stroke="#1565C0" stroke-width="3.5"/>
  <rect x="108" y="130" width="30" height="7" rx="3.5" fill="#1976D2"/>
  <rect x="108" y="142" width="46" height="7" rx="3.5" fill="#42A5F5"/>
  <rect x="108" y="154" width="22" height="7" rx="3.5" fill="#90CAF9"/>

  <rect x="96" y="218" width="84" height="58" rx="12" fill="#FFFFFF" stroke="#1565C0" stroke-width="3.5"/>
  <rect x="108" y="232" width="36" height="7" rx="3.5" fill="#42A5F5"/>
  <rect x="108" y="244" width="48" height="7" rx="3.5" fill="#1976D2"/>
  <rect x="108" y="256" width="20" height="7" rx="3.5" fill="#90CAF9"/>

  <rect x="96" y="320" width="84" height="58" rx="12" fill="#FFFFFF" stroke="#1565C0" stroke-width="3.5"/>
  <rect x="108" y="334" width="44" height="7" rx="3.5" fill="#1976D2"/>
  <rect x="108" y="346" width="26" height="7" rx="3.5" fill="#90CAF9"/>
  <rect x="108" y="358" width="40" height="7" rx="3.5" fill="#42A5F5"/>

  <!-- Связи «файлы → сборка» -->
  <line x1="186" y1="145" x2="230" y2="192" stroke="#1976D2" stroke-width="3" stroke-opacity="0.55" stroke-dasharray="1 10" stroke-linecap="round"/>
  <line x1="186" y1="247" x2="230" y2="247" stroke="#1976D2" stroke-width="3" stroke-opacity="0.55" stroke-dasharray="1 10" stroke-linecap="round"/>
  <line x1="186" y1="349" x2="230" y2="302" stroke="#1976D2" stroke-width="3" stroke-opacity="0.55" stroke-dasharray="1 10" stroke-linecap="round"/>

  <!-- Стрелки направления (вход в ядро сборки) -->
  <polygon points="0 -7 0 7 13 0" fill="#1976D2" transform="translate(228 188) rotate(44)"/>
  <polygon points="0 -7 0 7 13 0" fill="#1976D2" transform="translate(228 247) rotate(0)"/>
  <polygon points="0 -7 0 7 13 0" fill="#1976D2" transform="translate(228 302) rotate(-44)"/>

  <!-- Ядро сборки -->
  <rect x="238" y="156" width="184" height="184" rx="46" fill="#1565C0"/>
  <circle cx="330" cy="250" r="66" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="3 10" stroke-linecap="round"/>
  <circle cx="330" cy="184" r="3.5" fill="#FFFFFF" fill-opacity="0.95"/>
  <circle cx="396" cy="250" r="3.5" fill="#FFFFFF" fill-opacity="0.95"/>
  <circle cx="330" cy="250" r="44" fill="#0D47A1"/>
  <polygon points="317 229 317 271 354 250" fill="#FFFFFF"/>

  <!-- Связь «сборка → стек развёртывания» -->
  <path d="M 422 260 C 462 330 478 350 490 350" fill="none" stroke="#1976D2" stroke-width="3" stroke-opacity="0.55" stroke-dasharray="1 10" stroke-linecap="round"/>
  <polygon points="484 339 484 363 508 351" fill="#1976D2"/>

  <!-- Артефакты релиза (готовые сборки уходят из-под ядра) -->
  <ellipse cx="352" cy="460" rx="92" ry="7" fill="#0D47A1" fill-opacity="0.06"/>
  <rect x="300" y="416" width="26" height="24" rx="7" fill="#FFFFFF" stroke="#1565C0" stroke-width="3"/>
  <circle cx="313" cy="428" r="3.5" fill="#90CAF9"/>
  <rect x="344" y="424" width="26" height="24" rx="7" fill="#FFFFFF" stroke="#1565C0" stroke-width="3"/>
  <circle cx="357" cy="436" r="3.5" fill="#90CAF9"/>
  <rect x="388" y="416" width="26" height="24" rx="7" fill="#FFFFFF" stroke="#1565C0" stroke-width="3"/>
  <circle cx="401" cy="428" r="3.5" fill="#90CAF9"/>

  <!-- Стек развёртывания (уровни-платформы) -->
  <rect x="508" y="326" width="204" height="56" rx="18" fill="#FFFFFF" stroke="#1565C0" stroke-width="3.5"/>
  <rect x="532" y="262" width="156" height="56" rx="18" fill="#C7E0F8" stroke="#1565C0" stroke-width="3.5"/>
  <rect x="556" y="198" width="108" height="56" rx="18" fill="#42A5F5"/>
  <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="#FFFFFF" transform="translate(596 211.9) scale(1.15)"/>
</svg>
