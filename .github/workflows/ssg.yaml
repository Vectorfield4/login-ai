name: Build and Release SSG Site

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ssg-deploy
  cancel-in-progress: false

jobs:
  build-ssg:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Build static site (Astro SSG)
        run: npm run build
        working-directory: .

      - name: Verify built output (head, og:image, assets)
        run: npm run verify:dist
        working-directory: .

      - name: Create ZIP archive
        working-directory: dist
        run: Compress-Archive -Path * -DestinationPath ..\ssg-site.zip

      - name: Deploy to FTP (sync)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_LOGIN }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.FTP_PATH }}
          local-dir: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: ssg-site.zip
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: docs/releases/v${{ steps.version.outputs.version }}.md
