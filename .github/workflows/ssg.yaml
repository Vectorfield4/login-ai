name: Build and Release SSG Site

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0). Leave empty for auto-generated.'
        required: false
        default: ''

jobs:
  build-ssg:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build static site (Astro SSG)
        run: npm run build
        working-directory: .

      - name: Verify built output (head, og:image, assets)
        run: npm run verify:dist
        working-directory: .

      - name: Create ZIP archive
        working-directory: dist
        run: Compress-Archive -Path * -DestinationPath ..\ssg-site.zip

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: ssg-site.zip
          tag_name: ${{ inputs.version != '' && inputs.version || format('build-{0}', github.run_number) }}
          name: ${{ inputs.version != '' && inputs.version || format('Build {0}', github.run_number) }}
          generate_release_notes: true

      - name: Deploy to FTP (sync)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_LOGIN }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.FTP_PATH }}
          local-dir: dist/
