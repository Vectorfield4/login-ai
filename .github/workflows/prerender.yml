name: Build and Release Prerendered HTML

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0). Leave empty for auto-generated.'
        required: false
        default: ''

jobs:
  build-prerender:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build
        working-directory: .

      - name: Build SSR prerender bundle
        run: npm run build -- --ssr src/prerender.tsx --outDir dist/ssr
        working-directory: .

      - name: Generate prerendered HTML files
        run: node scripts/prerender.mjs
        working-directory: .

      - name: Create ZIP archive
        working-directory: dist
        run: Compress-Archive -Path * -DestinationPath ..\prerendered-html.zip

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: prerendered-html.zip
          tag_name: ${{ inputs.version != '' && inputs.version || format('build-{0}', github.run_number) }}
          name: ${{ inputs.version != '' && inputs.version || format('Build {0}', github.run_number) }}
          generate_release_notes: true